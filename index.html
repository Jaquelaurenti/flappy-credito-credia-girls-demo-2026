<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101a24" />
    <title>Flappy Crédito</title>
    <link rel="stylesheet" href="style.css" />
    <script src="business.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-heading">
        <span class="eyebrow">UMA JORNADA FINANCEIRA</span>
        <h1>Flappy <span>Crédito</span></h1>
      </header>
      <canvas
        id="game"
        width="480"
        height="720"
        aria-label="Flappy Crédito. Clique ou pressione espaço para voar."
        role="img"
      ></canvas>
      <p class="controls">
        <kbd>ESPAÇO</kbd><span>ou</span><kbd>↑</kbd
        ><span>ou toque para voar</span>
      </p>
      <p class="credit">Itaú Unibanco × AWS Builders League · CredIA Girls</p>
      <span id="game-status" class="sr-only" aria-live="polite"></span>
    </main>
  </body>
</html>
